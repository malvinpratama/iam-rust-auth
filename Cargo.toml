[package]
name = "auth-service"
version = "0.5.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "auth-service"
path = "src/main.rs"

[dependencies]
common = { git = "https://github.com/malvinpratama/iam-rust-common", tag = "v0.10.0" }
proto = { git = "https://github.com/malvinpratama/iam-rust-proto", tag = "v0.11.0" }
tokio = { version = "1", features = ["full"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-tracing-opentelemetry = "0.38"
prost = "0.14"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
totp-rs = { version = "5", features = ["otpauth", "gen_secret"] }
rsa = { version = "0.9", features = ["pem"] }
base64 = "0.22"
tracing = "0.1"
anyhow = "1"
async-nats = "0.37"
serde_json = "1"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
futures = "0.3"

[features]
# Gates the testcontainers-backed integration tests (need Docker).
# Run with: cargo test --features integration
integration = []

[dev-dependencies]
testcontainers-modules = { version = "0.11", features = ["postgres"] }
