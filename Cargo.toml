[package]
name = "auth-service"
version = "0.5.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "auth-service"
path = "src/main.rs"

[dependencies]
common = { git = "https://github.com/malvinpratama/iam-rust-common", tag = "v0.5.0" }
proto = { git = "https://github.com/malvinpratama/iam-rust-proto", tag = "v0.4.0" }
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
tonic-health = "0.12"
prost = "0.13"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
tracing = "0.1"
anyhow = "1"
async-nats = "0.37"
serde_json = "1"
